<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Cofrinho</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#2ecc71">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Meu Cofrinho</h1>
            <button class="btn-settings" onclick="openSettings()" title="Configurações"><i class="fas fa-cog"></i></button>
            <div class="balance-card">
                <span>Saldo Total</span>
                <h2 id="total-balance">R$ 0,00</h2>
            </div>
        </header>

        <!-- Modal de Configurações -->
        <div id="settings-modal" class="settings-modal hidden">
            <div class="settings-box">
                <h3><i class="fas fa-cog"></i> Configurações</h3>
                <p>Insira sua chave de API para usar a IA de contagem de dinheiro.</p>
                <input type="password" id="api-key-input" placeholder="Sua API Key (Gemini/OpenAI/etc)" autocomplete="off">
                <a href="https://aistudio.google.com/apikey" target="_blank">Obter chave Gemini grátis</a>
                <div class="settings-buttons">
                    <button class="btn-main" onclick="saveApiKey()">Salvar</button>
                    <button class="btn-main secondary" onclick="closeSettings()">Cancelar</button>
                </div>
            </div>
        </div>

        <main>
            <button class="btn-main" onclick="openScanner()">
                <i class="fas fa-camera"></i> Câmera Calculadora
            </button>
            <input type="file" id="file-upload" hidden accept="image/*" onchange="calculateFromPhoto(event)">
            <button class="btn-main secondary" onclick="document.getElementById('file-upload').click()">
                <i class="fas fa-file-invoice-dollar"></i> Calcular Foto
            </button>

            <!-- Histórico -->
            <section class="history" id="history-section">
                <h3><i class="fas fa-history"></i> Histórico</h3>
                <ul id="history-list"></ul>
                <p id="history-empty" style="text-align:center;color:#888;padding:20px;display:none;">
                    Nenhuma transação ainda. Use a câmera ou foto para começar!
                </p>
            </section>
        </main>

        <!-- Overlay da Câmera -->
        <div id="camera-overlay" class="camera-overlay hidden">
            <video id="video" autoplay playsinline></video>
            <div class="scanner-frame"></div>
            <div class="camera-ui">
                <div class="scanning-info">
                    <p id="scan-status">Buscando dinheiro...</p>
                    <h3 id="current-scan-value">R$ 0,00</h3>
                </div>
                <button class="btn-add" onclick="confirmScan()">Adicionar e Continuar</button>
                <button class="btn-circle cancel" onclick="closeScanner()">X</button>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
