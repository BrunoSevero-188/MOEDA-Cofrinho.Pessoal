<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Cofrinho</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button class="btn-settings" onclick="openSettings()">
                <i class="fas fa-gear"></i>
            </button>
            <h1>Meu Cofrinho</h1>
            <div class="balance-card">
                <span>Saldo Total</span>
                <h2 id="total-balance">R$ 0,00</h2>
            </div>
        </header>

        <main>
            <button class="btn-main" onclick="openScanner()">
                <i class="fas fa-camera"></i> Câmera Calculadora
            </button>
            <input type="file" id="file-upload" hidden accept="image/*" onchange="calculateFromPhoto(event)">
            <button class="btn-main secondary" onclick="document.getElementById('file-upload').click()">
                <i class="fas fa-file-invoice-dollar"></i> Calcular Foto
            </button>
        </main>

        <!-- Overlay da Câmera -->
        <div id="camera-overlay" class="camera-overlay hidden">
            <video id="video" autoplay playsinline></video>
            <div class="scanner-frame"></div>
            <div class="camera-ui">
                <div class="scanning-info">
                    <p id="scan-status">Buscando dinheiro...</p>
                    <h3 id="current-scan-value">R$ 0,00</h3>
                </div>
                <button class="btn-add" onclick="confirmScan()">Adicionar e Continuar</button>
                <button class="btn-circle cancel" onclick="closeScanner()">X</button>
            </div>
        </div>

        <!-- Modal de Configurações (API Key) -->
        <div id="settings-modal" class="settings-modal hidden">
            <div class="settings-box">
                <h3>Configurar API Key</h3>
                <p>Cole sua chave da API do Google Gemini. Ela fica salva só neste navegador.</p>
                <input type="password" id="api-key-input" placeholder="Cole sua chave aqui">
                <a href="https://aistudio.google.com/apikey" target="_blank">Gerar chave gratuita no Google AI Studio</a>
                <div class="settings-buttons">
                    <button class="btn-add" onclick="saveApiKey()">Salvar</button>
                    <button class="btn-circle cancel" onclick="closeSettings()">X</button>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
